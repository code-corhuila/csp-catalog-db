# Migration executor of csp-catalog-db (Annex J). This file defines NO database service and NO volume:
# the single MongoDB instance of the environment belongs to csp-infra-mongo, which composes this
# file with `include` and joins the same `platform` network. Run the executor before the API starts.
# The executor logs in as the catalog domain user (CATALOG_DB_USER), which csp-infra-mongo creates with access only
# to catalog_db (ADR-006, Annex G): it owns this database and nothing else. No credential is written here.
name: csp-catalog-db

services:
  catalog-db-migrate:
    build:
      context: .
      dockerfile: liquibase.Dockerfile
    profiles: [tooling]
    volumes:
      - ../:/workspace:ro
    entrypoint: ["liquibase",
      "--search-path=/workspace",
      "--changelog-file=changelog/changelog-master.yaml",
      "--database-changelog-table-name=databasechangelog_catalog",
      "--database-changelog-lock-table-name=databasechangeloglock_catalog",
      "--url=mongodb://${MONGO_HOST:-mongodb}:27017/${CATALOG_DB_NAME:-catalog_db}?replicaSet=rs0",
      "--username=${CATALOG_DB_USER:?set CATALOG_DB_USER}",
      "--password=${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}"]
    command: ["update"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true

name: Database rebuild

# The whole changelog must build the database from an EMPTY MongoDB, every changeset
# must undo itself through its inline rollback, and the changelog must apply again
# afterwards. If the only place the database works is where it was patched by hand,
# the next environment cannot exist.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_NAME: catalog_db
      MONGO: catalog-mongo
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB with authentication, a key file and a replica set of one node
        # The same MongoDB as the instance of csp-infra-mongo (7.0.14, authentication, key file, replica set rs0). The member
        # is localhost:27017 so that the executor, which shares the network of this container, and the tests reach it.
        run: |
          docker run -d --name "$MONGO" -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=ci_admin -e MONGO_INITDB_ROOT_PASSWORD=ci-admin-password \
            --entrypoint sh mongo:7.0.14 -c "printf '%s' 'cikeyfile0123456789abcdefghijklmnopqrstuvwxyz' > /data/keyfile && chmod 400 /data/keyfile && chown mongodb:mongodb /data/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile --bind_ip_all"
          admin() { docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin --eval "$1"; }
          for i in $(seq 1 40); do
            state=$(admin "try { rs.status().myState } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); 0 }" 2>&1 | tail -1)
            [ "$state" = "1" ] && break
            sleep 3
          done
          test "$state" = "1" || { echo "replica set did not reach PRIMARY"; exit 1; }

      - name: Create the logins as csp-infra-mongo does
        # The owner for the executor (ADR-049), the login of the API with no role and the login of the relay, in catalog_db.
        # The passwords are throwaways of this disposable container.
        run: |
          docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin --eval "
            const d = db.getSiblingDB('$DB_NAME');
            d.createUser({user: 'catalog_migrator', pwd: 'ci-migrator-password', roles: [{role: 'dbOwner', db: '$DB_NAME'}]});
            d.createUser({user: 'catalog_app', pwd: 'ci-app-password', roles: []});
            d.createUser({user: 'worker_app', pwd: 'ci-worker-password', roles: []});"

      - name: Build the executor image
        run: docker build -f deploy/liquibase.Dockerfile -t catalog-db-migrate:ci deploy

      - name: Apply, roll everything back, apply again
        run: |
          lb() {
            docker run --rm --network "container:$MONGO" -v "$PWD:/workspace:ro" --entrypoint liquibase catalog-db-migrate:ci \
              --search-path=/workspace \
              --changelog-file=changelog/changelog-master.yaml \
              --database-changelog-table-name=databasechangelog_catalog \
              --database-changelog-lock-table-name=databasechangeloglock_catalog \
              "--url=mongodb://localhost:27017/$DB_NAME?replicaSet=rs0" \
              --username=catalog_migrator --password=ci-migrator-password "$@"
          }
          mongo_eval() { docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin "$DB_NAME" --eval "$1"; }

          lb update

          # A second run must apply nothing: the changesets are incremental.
          lb update | tee "$RUNNER_TEMP/second.txt"
          grep -Eq 'Run:[[:space:]]+0' "$RUNNER_TEMP/second.txt" || { echo "second update applied changesets: not incremental"; exit 1; }

          # The control collections carry the _catalog names (Annex J.6), never the defaults.
          names=$(mongo_eval "db.getCollectionNames().join(',')")
          echo "collections: $names"
          case ",$names," in *,databasechangelog_catalog,*) ;; *) echo "missing databasechangelog_catalog"; exit 1;; esac
          case ",$names," in *,databasechangeloglock_catalog,*) ;; *) echo "missing databasechangeloglock_catalog"; exit 1;; esac
          case ",$names," in *,DATABASECHANGELOG,*|*,DATABASECHANGELOGLOCK,*) echo "default control collections found"; exit 1;; esac

          # Every changeset declares its inverse inline: roll back all the applied ones.
          applied=$(mongo_eval "db.databasechangelog_catalog.countDocuments({})")
          echo "applied changesets: $applied"
          if [ "$applied" -gt 0 ]; then lb rollback-count "$applied"; fi

          # Nothing of the application may remain once everything is rolled back.
          left=$(mongo_eval "db.getCollectionNames().filter(n => !n.startsWith('system.') && !n.startsWith('databasechangelog')).length")
          test "$left" = 0 || { echo "rollback left $left application collection(s) behind"; exit 1; }

          lb update
          lb validate

          # The validator must accept valid documents, reject invalid ones and the named index must exist.
          docker cp tests "$MONGO":/tests
          docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin "$DB_NAME" /tests/movies_schema_test.js
          docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin "$DB_NAME" /tests/idempotency_key_schema_test.js
          docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin "$DB_NAME" /tests/outbox_reader_role_test.js
          docker exec "$MONGO" mongosh --quiet -u ci_admin -p ci-admin-password --authenticationDatabase admin "$DB_NAME" /tests/catalog_writer_role_test.js
          # The login of the API, with only catalog_writer, can read and write the collections and cannot change the structure.
          docker exec "$MONGO" mongosh --quiet -u catalog_app -p ci-app-password --authenticationDatabase "$DB_NAME" "$DB_NAME" /tests/catalog_app_privileges_test.js

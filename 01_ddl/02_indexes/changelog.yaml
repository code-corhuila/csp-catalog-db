databaseChangeLog:
  - changeSet:
      id: movies-002-index-publication-status-deleted-at
      author: karencaicedo1907
      changes:
        - createIndex:
            collectionName: movies
            keys: |
              { publication_status: 1, deleted_at: 1 }
            options: |
              { name: "idx_movies_publication_status_deleted_at" }
      rollback:
        - dropIndex:
            collectionName: movies
            keys: |
              { publication_status: 1, deleted_at: 1 }
  - changeSet:
      id: idempotency-key-002-index-created-at-ttl
      author: karencaicedo1907
      changes:
        - createIndex:
            collectionName: idempotency_key
            keys: |
              { created_at: 1 }
            options: |
              { name: "idx_idempotency_key_created_at", expireAfterSeconds: 604800 }
      rollback:
        - dropIndex:
            collectionName: idempotency_key
            keys: |
              { created_at: 1 }
  - changeSet:
      id: rooms-002-index-name-unique
      author: karencaicedo1907
      changes:
        - createIndex:
            collectionName: rooms
            keys: |
              { name: 1 }
            options: |
              { name: "idx_rooms_name", unique: true }
      rollback:
        - dropIndex:
            collectionName: rooms
            keys: |
              { name: 1 }

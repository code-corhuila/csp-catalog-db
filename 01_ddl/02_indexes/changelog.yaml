              { room_id: 1, starts_at: 1 }
            options: |
              { name: "idx_showtimes_room_id_starts_at" }
      rollback:
        - dropIndex:
            collectionName: showtimes
            keys: |
              { room_id: 1, starts_at: 1 }
  - changeSet:

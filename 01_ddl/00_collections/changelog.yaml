databaseChangeLog:
  - changeSet:
      id: movies-001-create-collection
      author: karencaicedo1907
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: movies
      changes:
        - createCollection:
            collectionName: movies
            options: |
              {
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "title", "duration_minutes", "classification", "publication_status", "created_at", "updated_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      title: { bsonType: "string", minLength: 1, maxLength: 255 },
                      synopsis: { bsonType: ["string", "null"] },
                      duration_minutes: { bsonType: "int", minimum: 1 },
                      classification: { bsonType: "string", minLength: 1 },
                      release_date: { bsonType: ["date", "null"] },
                      genres: { bsonType: ["array", "null"], maxItems: 20, items: { bsonType: "string" } },
                      poster_url: { bsonType: ["string", "null"] },
                      publication_status: { enum: ["DRAFT", "PUBLISHED", "ARCHIVED"] },
                      created_at: { bsonType: "date" },
                      updated_at: { bsonType: "date" },
                      deleted_at: { bsonType: ["date", "null"] }
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: movies
  - changeSet:
      id: idempotency-key-001-create-collection
      author: karencaicedo1907
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: idempotency_key
      changes:
        - createCollection:
            collectionName: idempotency_key
            options: |
              {
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "operation", "request_hash", "resource_id", "created_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", minLength: 8, maxLength: 128 },
                      operation: { enum: ["CREATE_MOVIE", "UPDATE_MOVIE", "ARCHIVE_MOVIE"] },
                      request_hash: { bsonType: "string", pattern: "^[0-9a-f]{64}$" },
                      resource_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      created_at: { bsonType: "date" }
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: idempotency_key
  - changeSet:
      id: rooms-001-create-collection
      author: karencaicedo1907
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: rooms
      changes:
        - createCollection:
            collectionName: rooms
            options: |
              {
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "name", "capacity", "seats", "created_at", "updated_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      name: { bsonType: "string", minLength: 1, maxLength: 100 },
                      capacity: { bsonType: "int", minimum: 1 },
                      seats: {
                        bsonType: "array",
                        minItems: 1,
                        maxItems: 500,
                        items: {
                          bsonType: "object",
                          required: ["seat_number"],
                          additionalProperties: false,
                          properties: {
                            seat_number: { bsonType: "string", minLength: 1 },
                            row: { bsonType: ["string", "null"] },
                            column: { bsonType: ["int", "null"], minimum: 1 },
                            type: { enum: ["STANDARD", "VIP", "ACCESSIBLE"] }
                          }
                        }
                      },
                      created_at: { bsonType: "date" },
                      updated_at: { bsonType: "date" },
                      deleted_at: { bsonType: ["date", "null"] }
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: rooms
  - changeSet:
      id: showtimes-001-create-collection
      author: karencaicedo1907
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: showtimes
      changes:
        - createCollection:
            collectionName: showtimes
            options: |
              {
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $and: [
                    {
                      $jsonSchema: {
                        bsonType: "object",
                        required: ["_id", "movie_id", "room_id", "movie_title_snapshot", "room_name_snapshot", "starts_at", "ends_at", "price_cents", "status", "created_at", "updated_at"],
                        additionalProperties: false,
                        properties: {
                          _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                          movie_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                          room_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                          movie_title_snapshot: { bsonType: "string", minLength: 1 },
                          room_name_snapshot: { bsonType: "string", minLength: 1 },
                          starts_at: { bsonType: "date" },
                          ends_at: { bsonType: "date" },
                          price_cents: { bsonType: "long", minimum: 0 },
                          audio_language: { bsonType: ["string", "null"] },
                          subtitle_language: { bsonType: ["string", "null"] },
                          status: { enum: ["SCHEDULED", "CANCELLED", "COMPLETED"] },
                          created_at: { bsonType: "date" },
                          updated_at: { bsonType: "date" },
                          deleted_at: { bsonType: ["date", "null"] }
                        }
                      }
                    },
                    { $expr: { $gt: ["$ends_at", "$starts_at"] } }
                  ]
                }
              }
      rollback:
        - dropCollection:
            collectionName: showtimes
  - changeSet:
      id: outbox-event-001-create-collection
      author: karencaicedo1907
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: outbox_event
      changes:
        - createCollection:
            collectionName: outbox_event
            options: |
              {
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "aggregate_type", "aggregate_id", "event_type", "payload", "created_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      aggregate_type: { enum: ["Showtime"] },
                      aggregate_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      event_type: { enum: ["ShowtimePublished"] },
                      payload: { bsonType: "object" },
                      created_at: { bsonType: "date" }
                    }
                  }
                }
              }
      rollback:
        - dropCollection:
            collectionName: outbox_event

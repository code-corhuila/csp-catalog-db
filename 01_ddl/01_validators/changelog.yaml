databaseChangeLog:
  - changeSet:
      id: movies-003-validator-add-cast
      author: karencaicedo1907
      changes:
        - runCommand:
            command: |
              {
                collMod: "movies",
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "title", "duration_minutes", "classification", "publication_status", "created_at", "updated_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      title: { bsonType: "string", minLength: 1, maxLength: 255 },
                      synopsis: { bsonType: ["string", "null"] },
                      duration_minutes: { bsonType: "int", minimum: 1 },
                      classification: { bsonType: "string", minLength: 1 },
                      release_date: { bsonType: ["date", "null"] },
                      genres: { bsonType: ["array", "null"], maxItems: 20, items: { bsonType: "string" } },
                      cast: { bsonType: ["array", "null"], maxItems: 50, items: { bsonType: "string" } },
                      poster_url: { bsonType: ["string", "null"] },
                      publication_status: { enum: ["DRAFT", "PUBLISHED", "ARCHIVED"] },
                      created_at: { bsonType: "date" },
                      updated_at: { bsonType: "date" },
                      deleted_at: { bsonType: ["date", "null"] }
                    }
                  }
                }
              }
      rollback:
        - runCommand:
            command: |
              {
                collMod: "movies",
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "title", "duration_minutes", "classification", "publication_status", "created_at", "updated_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      title: { bsonType: "string", minLength: 1, maxLength: 255 },
                      synopsis: { bsonType: ["string", "null"] },
                      duration_minutes: { bsonType: "int", minimum: 1 },
                      classification: { bsonType: "string", minLength: 1 },
                      release_date: { bsonType: ["date", "null"] },
                      genres: { bsonType: ["array", "null"], maxItems: 20, items: { bsonType: "string" } },
                      poster_url: { bsonType: ["string", "null"] },
                      publication_status: { enum: ["DRAFT", "PUBLISHED", "ARCHIVED"] },
                      created_at: { bsonType: "date" },
                      updated_at: { bsonType: "date" },
                      deleted_at: { bsonType: ["date", "null"] }
                    }
                  }
                }
              }
  - changeSet:
      id: idempotency-key-003-validator-room-operations
      author: karencaicedo1907
      changes:
        - runCommand:
            command: |
              {
                collMod: "idempotency_key",
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "operation", "request_hash", "resource_id", "created_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", minLength: 8, maxLength: 128 },
                      operation: { enum: ["CREATE_MOVIE", "UPDATE_MOVIE", "ARCHIVE_MOVIE", "CREATE_ROOM", "UPDATE_ROOM", "ARCHIVE_ROOM"] },
                      request_hash: { bsonType: "string", pattern: "^[0-9a-f]{64}$" },
                      resource_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      created_at: { bsonType: "date" }
                    }
                  }
                }
              }
      rollback:
        - runCommand:
            command: |
              {
                collMod: "idempotency_key",
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "operation", "request_hash", "resource_id", "created_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", minLength: 8, maxLength: 128 },
                      operation: { enum: ["CREATE_MOVIE", "UPDATE_MOVIE", "ARCHIVE_MOVIE"] },
                      request_hash: { bsonType: "string", pattern: "^[0-9a-f]{64}$" },
                      resource_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      created_at: { bsonType: "date" }
                    }
                  }
                }
              }
  - changeSet:
      id: rooms-003-validator-add-schedule-version
      author: karencaicedo1907
      changes:
        - runCommand:
            command: |
              {
                collMod: "rooms",
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "name", "capacity", "seats", "created_at", "updated_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      name: { bsonType: "string", minLength: 1, maxLength: 100 },
                      capacity: { bsonType: "int", minimum: 1 },
                      seats: {
                        bsonType: "array",
                        minItems: 1,
                        maxItems: 500,
                        items: {
                          bsonType: "object",
                          required: ["seat_number"],
                          additionalProperties: false,
                          properties: {
                            seat_number: { bsonType: "string", minLength: 1 },
                            row: { bsonType: ["string", "null"] },
                            column: { bsonType: ["int", "null"], minimum: 1 },
                            type: { enum: ["STANDARD", "VIP", "ACCESSIBLE"] }
                          }
                        }
                      },
                      schedule_version: { bsonType: "int", minimum: 0 },
                      created_at: { bsonType: "date" },
                      updated_at: { bsonType: "date" },
                      deleted_at: { bsonType: ["date", "null"] }
                    }
                  }
                }
              }
      rollback:
        - runCommand:
            command: |
              {
                collMod: "rooms",
                validationLevel: "strict",
                validationAction: "error",
                validator: {
                  $jsonSchema: {
                    bsonType: "object",
                    required: ["_id", "name", "capacity", "seats", "created_at", "updated_at"],
                    additionalProperties: false,
                    properties: {
                      _id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
                      name: { bsonType: "string", minLength: 1, maxLength: 100 },
                      capacity: { bsonType: "int", minimum: 1 },
                      seats: {
                        bsonType: "array",
                        minItems: 1,
                        maxItems: 500,
                        items: {
                          bsonType: "object",
                          required: ["seat_number"],
                          additionalProperties: false,
                          properties: {
                            seat_number: { bsonType: "string", minLength: 1 },
                            row: { bsonType: ["string", "null"] },
                            column: { bsonType: ["int", "null"], minimum: 1 },
                            type: { enum: ["STANDARD", "VIP", "ACCESSIBLE"] }
                          }
                        }
                      },
                      created_at: { bsonType: "date" },
                      updated_at: { bsonType: "date" },
                      deleted_at: { bsonType: ["date", "null"] }
                    }
                  }
                }
              }

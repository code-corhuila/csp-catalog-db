                      request_hash: { bsonType: "string", pattern: "^[0-9a-f]{64}$" },
                      resource_id: { bsonType: "string", pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" },
